<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Hajjan - Certificate Verification</title>
    <style>
        /* خلفية بيضاء صافية بالكامل بناءً على التفضيلات */
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
            border: 1px solid #e0e0e0;
        }
        .header-title {
            color: #003366;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .sub-title {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }
        input {
            width: 85%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #003366;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #002244;
        }
        #result {
            margin-top: 25px;
            font-size: 15px;
            line-height: 1.6;
            text-align: right;
            display: none;
        }
        .success-box {
            padding: 20px;
            border-radius: 4px;
            background-color: #ffffff;
            border: 2px solid #28a745;
        }
        .error-box {
            padding: 20px;
            border-radius: 4px;
            background-color: #ffffff;
            color: #721c24;
            border: 2px solid #dc3545;
            text-align: center;
            font-weight: bold;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: right;
        }
        .data-table th {
            background-color: #f8f9fa;
            width: 35%;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Al-Hajjan Drilling Company</div>
        <div class="sub-title">نظام التحقق من الشهادات التدريبية (HSE Training Verification)</div>
        
        <input type="text" id="certInput" placeholder="أدخل رقم الشهادة (مثل: HDC260209HR01)">
        <br>
        <button onclick="verifyCertificate()">التحقق من السجلات</button>
        
        <div id="result"></div>
    </div>

    <script>
        const sheetId = '1CqO3496eRXg71EbI5VvZxQnu0_spCQJ5W7i53r5gAFc';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        // دالة لاستخراج البيانات بأمان وتجنب الخلايا الفارغة
        function getVal(row, index) {
            if (!row || !row.c || !row.c[index] || row.c[index].v === null) return 'غير متوفر';
            return row.c[index].f ? row.c[index].f : row.c[index].v;
        }

        async function verifyCertificate() {
            const certNoInput = document.getElementById('certInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if (!certNoInput) {
                showResult('يرجى إدخال رقم الشهادة أولاً للتحقق.', 'error-box');
                return;
            }

            // إظهار رسالة تحميل
            showResult('جاري الاتصال بقاعدة البيانات والبحث...', 'success-box');
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const text = await response.text();
                
                // طريقة أكثر أماناً لاستخراج الـ JSON بدلاً من الـ Regex
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                const rows = data.table.rows;
                
                let isFound = false;

                // الأعمدة: EMID(0), NAME(1), IQAMA(2), COURSE(3), DATE(4), EXPIRY(5), TTT(6), CERTNO(7)
                for (let i = 0; i < rows.length; i++) {
                    const certNoCell = getVal(rows[i], 7).toString().trim().toUpperCase(); 
                    
                    if (certNoCell === certNoInput) {
                        isFound = true;
                        
                        const emid = getVal(rows[i], 0);
                        const name = getVal(rows[i], 1);
                        const iqama = getVal(rows[i], 2);
                        const course = getVal(rows[i], 3);
                        const date = getVal(rows[i], 4);
                        const expiry = getVal(rows[i], 5);
                        const ttt = getVal(rows[i], 6);

                        showResult(`
                            <h3 style="margin-top:0; color:#28a745; text-align:center;">✅ الشهادة معتمدة ومسجلة</h3>
                            <table class="data-table">
                                <tr><th>رقم الشهادة (CERTNO)</th><td>${certNoCell}</td></tr>
                                <tr><th>الاسم (NAME)</th><td>${name}</td></tr>
                                <tr><th>الرقم الوظيفي (EMID)</th><td>${emid}</td></tr>
                                <tr><th>رقم الإقامة (IQAMA)</th><td>${iqama}</td></tr>
                                <tr><th>اسم الدورة (COURSE)</th><td>${course}</td></tr>
                                <tr><th>تاريخ الإصدار (DATE)</th><td>${date}</td></tr>
                                <tr><th>تاريخ الانتهاء (EXPIRY)</th><td>${expiry}</td></tr>
                                <tr><th>جهة التدريب (TTT)</th><td>${ttt}</td></tr>
                            </table>
                        `, 'success-box');
                        break; // إيقاف البحث بمجرد إيجاد النتيجة
                    }
                }

                if (!isFound) {
                    showResult('❌ عذراً، رقم الشهادة غير صحيح أو غير مدرج في السجلات الرسمية.', 'error-box');
                }

            } catch (error) {
                console.error("Fetch Error:", error);
                showResult('حدث خطأ أثناء جلب البيانات. إذا كنت تفتح الملف من الكمبيوتر مباشرة، جرب رفعه على استضافة ويب أو استخدم متصفح Firefox.', 'error-box');
            }
        }

        function showResult(message, className) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = className;
            resultDiv.style.display = 'block';
        }
    </script>

</body>
</html>
