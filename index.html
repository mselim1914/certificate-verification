<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Hajjan - HSE Training Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الصفحة والخلفية البيضاء الصافية */
        body {
            background-color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* الكارت الرئيسي */
        .container {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #f0f0f0;
            text-align: center;
            width: 100%;
            max-width: 550px;
            position: relative;
            overflow: hidden;
        }

        /* شريط علوي للزينة يتماشى مع الهوية البصرية */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #002244, #00509e);
        }

        /* العناوين */
        .header-title {
            color: #002244;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .sub-title {
            color: #64748b;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 35px;
        }

        /* حقل الإدخال */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #00509e;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 80, 158, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* زر البحث */
        button {
            background: linear-gradient(135deg, #003366 0%, #001a33 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 51, 102, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 51, 102, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        /* منطقة النتائج */
        #result {
            margin-top: 30px;
            font-size: 15px;
            line-height: 1.7;
            text-align: right;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-box {
            padding: 25px;
            border-radius: 12px;
            background-color: #f8fff9;
            border: 1px solid #cce5ff;
            border-right: 5px solid #28a745;
        }

        .error-box {
            padding: 20px;
            border-radius: 12px;
            background-color: #fff5f5;
            color: #e53e3e;
            border: 1px solid #fed7d7;
            text-align: center;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            background-color: #d4edda;
            color: #155724;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* جدول البيانات */
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 15px;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #edf2f7;
        }

        .data-table th, .data-table td {
            padding: 14px 16px;
            text-align: right;
            border-bottom: 1px solid #edf2f7;
        }

        .data-table tr:last-child th,
        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table th {
            background-color: #f8fafc;
            width: 35%;
            color: #475569;
            font-weight: 700;
            font-size: 14px;
        }

        .data-table td {
            color: #1e293b;
            font-weight: 500;
        }
        
        .loading-text {
            color: #00509e;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Al-Hajjan Drilling Company</div>
        <div class="sub-title">نظام التحقق من الشهادات التدريبية (HSE Training)</div>
        
        <div class="input-group">
            <input type="text" id="certInput" placeholder="أدخل رقم الشهادة (مثال: HDC260209HR01)">
        </div>
        
        <button onclick="verifyCertificate()">التحقق من السجلات</button>
        
        <div id="result"></div>
    </div>

    <script>
        const sheetId = '1CqO3496eRXg71EbI5VvZxQnu0_spCQJ5W7i53r5gAFc';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        function getVal(row, index) {
            if (!row || !row.c || !row.c[index] || row.c[index].v === null) return '<span style="color:#a0aec0;">غير متوفر</span>';
            return row.c[index].f ? row.c[index].f : row.c[index].v;
        }

        async function verifyCertificate() {
            const certNoInput = document.getElementById('certInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            if (!certNoInput) {
                showResult('⚠️ يرجى إدخال رقم الشهادة أولاً للتحقق.', 'error-box');
                return;
            }

            showResult('<div class="loading-text">⏳ جاري الاتصال بقاعدة البيانات والبحث...</div>', 'success-box');
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const text = await response.text();
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                const rows = data.table.rows;
                
                let isFound = false;

                // الأعمدة: EMID(0), NAME(1), IQAMA(2), COURSE(3), DATE(4), EXPIRY(5), TTT(6), CERTNO(7)
                for (let i = 0; i < rows.length; i++) {
                    const certNoCell = getVal(rows[i], 7).toString().replace(/<[^>]*>?/gm, '').trim().toUpperCase(); 
                    
                    if (certNoCell === certNoInput) {
                        isFound = true;
                        
                        const emid = getVal(rows[i], 0);
                        const name = getVal(rows[i], 1);
                        const iqama = getVal(rows[i], 2);
                        const course = getVal(rows[i], 3);
                        const date = getVal(rows[i], 4);
                        const expiry = getVal(rows[i], 5);
                        const ttt = getVal(rows[i], 6);

                        showResult(`
                            <div style="text-align: center;">
                                <div class="status-badge">✓ الشهادة معتمدة ومسجلة</div>
                            </div>
                            <table class="data-table">
                                <tr><th>رقم الشهادة</th><td style="font-family: monospace; font-size: 15px; color: #00509e;"><strong>${certNoCell}</strong></td></tr>
                                <tr><th>الاسم (NAME)</th><td>${name}</td></tr>
                                <tr><th>الرقم الوظيفي</th><td>${emid}</td></tr>
                                <tr><th>رقم الإقامة</th><td>${iqama}</td></tr>
                                <tr><th>اسم الدورة</th><td><strong>${course}</strong></td></tr>
                                <tr><th>تاريخ الإصدار</th><td>${date}</td></tr>
                                <tr><th>تاريخ الانتهاء</th><td>${expiry}</td></tr>
                                <tr><th>جهة التدريب</th><td>${ttt}</td></tr>
                            </table>
                        `, 'success-box');
                        break; 
                    }
                }

                if (!isFound) {
                    showResult('❌ عذراً، رقم الشهادة غير صحيح أو غير مدرج في السجلات الرسمية.', 'error-box');
                }

            } catch (error) {
                console.error("Fetch Error:", error);
                showResult('⚠️ حدث خطأ أثناء جلب البيانات. يرجى المحاولة لاحقاً.', 'error-box');
            }
        }

        function showResult(message, className) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = className;
            resultDiv.style.display = 'block';
        }

        // إضافة ميزة البحث عند الضغط على زر Enter في الكيبورد
        document.getElementById("certInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyCertificate();
            }
        });
    </script>

</body>
</html>
